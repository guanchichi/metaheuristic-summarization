# Configuration for Ablation: Without NSGA-II (using fast_fused MMR)
# Based on Final Fusion Config but different optimizer

objectives:
  lambda_importance: 1.0
  lambda_coverage: 2.5
  lambda_redundancy: 1.2

fusion:
  w_base: 0.5
  w_bert: 0.5

length_control:
  unit: tokens
  max_tokens: 245
  max_sentences: 30

optimizer:
  method: fast_fused
  pop_size: 100
  n_gen: 100

seed: 2024
